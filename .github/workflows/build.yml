name: FnTuiOS latest fork source
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
permissions:
  contents: read
concurrency:
  group: fntuios-build
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: user-no-found/BuildFlow
          path: .build-tools/BuildFlow
      - uses: actions/checkout@v4
        with:
          repository: user-no-found/FnPackKit
          path: .build-tools/FnPackKit
      - name: Configure explicit shared tool sources
        run: |
          echo "BUILDFLOW_PATH=$GITHUB_WORKSPACE/.build-tools/BuildFlow" >> "$GITHUB_ENV"
          echo "FNPACKKIT_PATH=$GITHUB_WORKSPACE/.build-tools/FnPackKit" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.build-tools/BuildFlow/src:$GITHUB_WORKSPACE/.build-tools/FnPackKit/src" >> "$GITHUB_ENV"
      - name: Download verified fnpack
        env:
          FNPACK_SHA256: 54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --retry 3 --output "$RUNNER_TEMP/fnpack" \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          printf '%s  %s\n' "$FNPACK_SHA256" "$RUNNER_TEMP/fnpack" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/fnpack"
      - name: Prepare native browser verification
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.56.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build configured fork HEAD and verify the actual FPK
        run: |
          export FNTUIOS_PLAYWRIGHT="$RUNNER_TEMP/browser/node_modules/playwright"
          export FNTUIOS_CHROMIUM=$(node -e 'console.log(require(process.argv[1]).chromium.executablePath())' "$FNTUIOS_PLAYWRIGHT")
          ./build.sh --next-version --channel stable --fnpack "$RUNNER_TEMP/fnpack"
      - name: Upload packages and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: fntuios
          path: |
            output/*.fpk
            output/*.fpk.sha256
          if-no-files-found: error
      - name: Upload build and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          include-hidden-files: true
          path: |
            .build/**/build.log
            .build/**/events.jsonl
            .build/**/report.json
            .build/**/reports/**/*.json
            .build/**/reports/**/*.png
            dist/localization-inventory-diff.json
          if-no-files-found: ignore
